[package]
name = "libdatachannel-rust"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
authors = ["peeque.tv"]
publish = false
description = "Native Rust port of libdatachannel. Replaces the C++ library; not an FFI wrapper."

[lib]
crate-type = ["rlib", "staticlib", "cdylib"]

[dependencies]
libjuice = { git = "ssh://git@github.com/ibsusu/libjuice-rs.git", rev = "4483fe91f84da96e586a2041c0d8c66ba98d3125" }
tracing = "0.1"
log = "0.4"
tokio = { version = "1", features = ["full"] }
parking_lot = "0.12"
crossbeam-channel = "0.5"
bytes = "1"
byteorder = "1"
zerocopy = { version = "0.8", features = ["derive"] }
sha1 = "0.10"
sha2 = "0.10"
hmac = "0.12"
subtle = "2"
rand = "0.8"
base64 = "0.22"
hex = "0.4"
thiserror = "2"
libc = "0.2"
once_cell = "1"
openssl = { version = "0.10", features = ["vendored"] }
openssl-sys = "0.9"

[build-dependencies]
cbindgen = "0.27"
bindgen = "0.70"
cc = "1"

[dev-dependencies]
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
