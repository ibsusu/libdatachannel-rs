# cbindgen config for the C-ABI shim in src/capi.rs.
#
# The canonical ABI is native/libdatachannel/include/rtc/rtc.h; this generated
# header (emitted to OUT_DIR/rtc.h) is a verification/convenience artifact. We
# emit plain C and only export the `rtc*` surface from the `capi` module.

language = "C"
header = "/* Generated by cbindgen from libdatachannel-rust src/capi.rs. */"
include_guard = "RTC_RUST_H"
pragma_once = true
cpp_compat = true
tab_width = 4
documentation = true
documentation_style = "c99"

[parse]
# Only parse this crate; do not descend into the C-dependency modules' macros
# or the workspace's other crates.
parse_deps = false

[export]
# Only the C-ABI symbols are relevant; everything else in the crate is internal.
prefix = ""
include = []
exclude = []

[fn]
prefix = ""
must_use = ""

[enum]
prefix_with_name = false
